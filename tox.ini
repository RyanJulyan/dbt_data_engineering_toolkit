[testenv]
changedir = integration_tests
skip_install = true
allowlist_externals = dbt
deps =
    PyYAML>=6,<7
passenv =
    ATHENA_*
    BIGQUERY_*
    CLICKHOUSE_*
    DATABRICKS_*
    DBT_ENV_SECRET_*
    DET_CLICKHOUSE_*
    REDSHIFT_*
    SNOWFLAKE_*
    SPARK_*

[testenv:dbt_integration_bigquery]
commands =
    dbt deps --profiles-dir . --target bigquery
    dbt build --profiles-dir . --target bigquery --exclude package:dbt_project_evaluator --full-refresh
    python ../scripts/dbt_coverage.py --manifest target/manifest.json --run-results target/run_results.json --public-api ../macros/schema.yml --macros-dir ../macros --minimum 80 --output target/dbt_coverage.json

