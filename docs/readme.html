<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>README Viewer | Data Engineering Toolkit</title>
  <meta name="description" content="Rendered Markdown viewer for repository documentation." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #dbe3ef;
      --primary: #2b7de9;
      --primary-dark: #0f2744;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.55;
    }

    .shell {
      width: min(1080px, calc(100% - 2rem));
      margin: 1rem auto 2rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.97);
      position: sticky;
      top: 12px;
      z-index: 10;
    }

    .brand {
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--primary-dark);
      white-space: nowrap;
    }

    .topbar nav {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .topbar a {
      text-decoration: none;
      color: var(--text);
      border: 1.5px solid transparent;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.34rem 0.7rem;
    }

    .topbar a:hover {
      color: var(--primary);
      border-color: rgba(43, 125, 233, 0.35);
      background: rgba(43, 125, 233, 0.08);
    }

    .header {
      margin-top: 1rem;
      border-radius: 22px;
      border: 1px solid #194b84;
      padding: 1rem 1.1rem;
      background:
        radial-gradient(1000px 520px at 10% 10%, rgba(91, 169, 255, 0.2), transparent 50%),
        linear-gradient(145deg, #0f2744 10%, #123a66 56%, #1b518c 100%);
      color: #fff;
      box-shadow: 0 22px 44px rgba(15, 39, 68, 0.22);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .meta {
      margin-top: 0.5rem;
      color: rgba(220, 235, 255, 0.95);
      font-size: 0.92rem;
    }

    .panel {
      margin-top: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 10px 28px rgba(15, 39, 68, 0.06);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      padding: 0.75rem;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    .toolbar a {
      text-decoration: none;
      color: var(--primary);
      border: 1.5px solid rgba(43, 125, 233, 0.35);
      border-radius: 999px;
      background: rgba(43, 125, 233, 0.08);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.3rem 0.58rem;
    }

    .markdown-body {
      padding: clamp(1rem, 2.5vw, 1.6rem);
      max-width: none;
      color: var(--text);
      background: #fff;
    }

    .state {
      padding: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .error {
      color: #b42318;
      background: #fef3f2;
      border: 1px solid #fecdca;
      border-radius: 12px;
      padding: 0.7rem;
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="Hub Navigation">
      <div class="brand">Data Engineering Toolkit</div>
      <nav>
        <a href="./index.html">Home</a>
        <a href="./dbt/hub.html">dbt Hub</a>
        <a href="./python/index.html">Python Hub</a>
        <a href="./readme.html?file=./quickstart.md&title=Quickstart">Quickstart</a>
        <a href="./dbt/index.html" target="_blank" rel="noopener noreferrer">Generated dbt docs</a>
      </nav>
    </nav>

    <section class="header">
      <span class="eyebrow" style="display:inline-block;font-size:0.75rem;letter-spacing:0.09em;text-transform:uppercase;border-radius:999px;border:1px solid rgba(255, 255, 255, 0.35);background:rgba(255, 255, 255, 0.1);padding:0.3rem 0.56rem;font-weight:700;">Markdown Viewer</span>
      <h1 id="title">README Viewer</h1>
      <div class="meta" id="meta">Loading markdown...</div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <a href="?file=https%3A%2F%2Fraw.githubusercontent.com%2Fsystemizing-solutions%2Fdbt_data_engineering_toolkit%2Fmain%2FREADME.md&title=Repository%20README">Repository README</a>
        <a href="?file=https%3A%2F%2Fraw.githubusercontent.com%2Fsystemizing-solutions%2Fdbt_data_engineering_toolkit%2Fmain%2Fpython%2FREADME.md&title=Python%20README">Python README</a>
      </div>
      <article id="content" class="markdown-body">
        <p class="state">Loading...</p>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const file =
        params.get("file") ||
        "https://raw.githubusercontent.com/systemizing-solutions/dbt_data_engineering_toolkit/main/README.md";
      const title = params.get("title") || "README Viewer";

      const titleEl = document.getElementById("title");
      const metaEl = document.getElementById("meta");
      const contentEl = document.getElementById("content");

      titleEl.textContent = title;
      metaEl.textContent = "Source: " + file;

      const markdownUrl = new URL(file, window.location.href);

      const renderer = new marked.Renderer();
      const isExternal = function (url) {
        return /^([a-z][a-z0-9+.-]*:|\/\/|#)/i.test(url);
      };

      renderer.link = function ({ href, title, text }) {
        const safeHref = href || "";
        const resolvedHref = isExternal(safeHref) ? safeHref : new URL(safeHref, markdownUrl).toString();
        const titleAttr = title ? ` title="${title}"` : "";
        return `<a href="${resolvedHref}"${titleAttr}>${text}</a>`;
      };

      renderer.image = function ({ href, title, text }) {
        const safeHref = href || "";
        const resolvedSrc = isExternal(safeHref) ? safeHref : new URL(safeHref, markdownUrl).toString();
        const titleAttr = title ? ` title="${title}"` : "";
        const alt = text || "";
        return `<img src="${resolvedSrc}" alt="${alt}"${titleAttr} />`;
      };

      try {
        const response = await fetch(markdownUrl.toString(), { cache: "no-store" });
        if (!response.ok) {
          throw new Error("HTTP " + response.status + " while loading markdown");
        }

        const markdown = await response.text();
        const html = marked.parse(markdown, {
          gfm: true,
          breaks: false,
          renderer
        });
        contentEl.innerHTML = html;
      } catch (error) {
        contentEl.innerHTML = '<p class="error">Unable to render markdown: ' + error.message + "</p>";
      }
    })();
  </script>
</body>
</html>
