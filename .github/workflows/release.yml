name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e "./python[test]"
      - name: Verify tag, quality gates, and release proof
        run: |
          python scripts/release.py verify-tag "${GITHUB_REF_NAME}"
          python scripts/static_check.py
          python scripts/generate_alias_facade.py --check
          make quality
          make python-coverage
          make deps parse dbt-coverage codegen evaluator
          det prove \
            python/src/dbt_data_engineering_toolkit_compiler/resources/data_product_multi_source_sample.xlsx \
            --project-dir examples/compiler/customer_accounts \
            --local-package-root .

  warehouse-integration:
    uses: ./.github/workflows/cloud-integration.yml
    secrets: inherit

  fusion-duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dbt Fusion
        run: python -m pip install --pre "dbt>=2.0.0,<3.0.0"
      - name: Build the integration suite with Fusion and DuckDB
        working-directory: integration_tests
        run: bash ../scripts/run_fusion_integration.sh dev

  build-python:
    needs: [validate, warehouse-integration, fusion-duckdb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build python --outdir dist
          python -m twine check dist/*
          python scripts/build_source_archive.py --output release/dbt_data_engineering_toolkit-v2.3.0.zip
      - name: Smoke-test the exact wheel
        run: |
          python -m venv /tmp/det-wheel-smoke
          /tmp/det-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/det-wheel-smoke/bin/det --help
          /tmp/det-wheel-smoke/bin/det workbook build /tmp/det-wheel-smoke.xlsx --no-input
          /tmp/det-wheel-smoke/bin/det validate /tmp/det-wheel-smoke.xlsx
          /tmp/det-wheel-smoke/bin/python - <<'PY'
          from importlib.resources import files

          resources = files("dbt_data_engineering_toolkit_compiler").joinpath("resources")
          expected = {
              "data_product.xlsx",
              "data_product_sample.xlsx",
              "data_product_multi_source_sample.xlsx",
              "operators.yml",
          }
          missing = sorted(name for name in expected if not resources.joinpath(name).is_file())
          if missing:
              raise SystemExit(f"wheel is missing package resources: {', '.join(missing)}")
          PY
      - name: Smoke-test installation from the exact source distribution
        run: |
          python -m venv /tmp/det-sdist-smoke
          /tmp/det-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/det-sdist-smoke/bin/det --help
          /tmp/det-sdist-smoke/bin/python -c \
            "import dbt_data_engineering_toolkit_compiler as package; print(package.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: release/
          if-no-files-found: error

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbt-data-engineering-toolkit-compiler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: release
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Create immutable GitHub release for dbt Package Hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file V2.3.0_RELEASE_NOTES.md
