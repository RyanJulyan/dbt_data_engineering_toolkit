name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  detect-tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      release_ready: ${{ steps.tag.outputs.release_ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: tag
        name: Require semver tag on tested commit
        run: |
          tag="$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "${tag}" ]]; then
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
          fi

  build-python:
    needs: detect-tag
    if: needs.detect-tag.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e "./python[test]"
      - name: Verify release tag and version alignment
        run: python scripts/release.py verify-tag "${{ needs.detect-tag.outputs.release_tag }}"
      - name: Build and inspect wheel and source distribution
        env:
          RELEASE_TAG: ${{ needs.detect-tag.outputs.release_tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          python -m pip install "build>=1.2,<2"
          python -m build python --outdir dist
          python scripts/build_source_archive.py --output "release/dbt_data_engineering_toolkit-v${release_version}.zip"
      - name: Smoke-test the exact wheel
        run: |
          python -m venv /tmp/det-wheel-smoke
          /tmp/det-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/det-wheel-smoke/bin/det --help
          /tmp/det-wheel-smoke/bin/det workbook build /tmp/det-wheel-smoke.xlsx --no-input
          /tmp/det-wheel-smoke/bin/det validate /tmp/det-wheel-smoke.xlsx
          /tmp/det-wheel-smoke/bin/python - <<'PY'
          from importlib.resources import files

          resources = files("dbt_data_engineering_toolkit_compiler").joinpath("resources")
          expected = {
              "data_product.xlsx",
              "data_product_sample.xlsx",
              "data_product_multi_source_sample.xlsx",
              "operators.yml",
          }
          missing = sorted(name for name in expected if not resources.joinpath(name).is_file())
          if missing:
              raise SystemExit(f"wheel is missing package resources: {', '.join(missing)}")
          PY
      - name: Smoke-test installation from the exact source distribution
        run: |
          python -m venv /tmp/det-sdist-smoke
          /tmp/det-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/det-sdist-smoke/bin/det --help
          /tmp/det-sdist-smoke/bin/python -c \
            "import dbt_data_engineering_toolkit_compiler as package; print(package.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: release/
          if-no-files-found: error

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbt-data-engineering-toolkit-compiler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: release
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    needs: [detect-tag, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.detect-tag.outputs.release_ready == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: release
      - name: Create immutable GitHub release for dbt Package Hub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect-tag.outputs.release_tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          notes_file="V${release_version}_RELEASE_NOTES.md"
          if [[ -f "${notes_file}" ]]; then
            gh release create "${RELEASE_TAG}" dist/* release/* \
              --title "${RELEASE_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" dist/* release/* \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
