# Merge these settings into the consuming project's dbt_project.yml.
# The dispatch entry is required by dbt_project_evaluator on DuckDB,
# Databricks/Spark, Redshift, ClickHouse, and Microsoft Fabric.

require-dbt-version: [">=1.10.6", "<3.0.0"]

dispatch:
  - macro_namespace: dbt
    search_order: ["dbt_project_evaluator", "dbt"]

vars:
  # Evaluate the consuming project, not installed package internals.
  exclude_packages: ["all"]

