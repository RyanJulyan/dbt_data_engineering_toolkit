name: dbt_data_engineering_toolkit_integration_tests
version: 1.0.0
config-version: 2

profile: dbt_data_engineering_toolkit_integration_tests

require-dbt-version: [">=1.10.6", "<3.0.0"]

flags:
  send_anonymous_usage_stats: false

dispatch:
  - macro_namespace: dbt
    search_order: ["dbt_project_evaluator", "dbt"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages", "logs", "integration.duckdb"]

vars:
  exclude_packages: ["all"]

models:
  dbt_data_engineering_toolkit_integration_tests:
    +materialized: table
    quarantine:
      +materialized: view

seeds:
  dbt_data_engineering_toolkit_integration_tests:
    +quote_columns: false
