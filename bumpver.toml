[bumpver]
current_version = "3.2.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "v{new_version}"
tag_scope = "default"
pre_commit_hook = "scripts/update_release_fixtures.py"
post_commit_hook = ""
commit = true
tag = true
push = true

[bumpver.file_patterns]
"python/pyproject.toml" = [
  '^version = "{version}"',
  '^current_version = "{version}"',
]
"python/src/dbt_data_engineering_toolkit_compiler/version.py" = [
  '^COMPILER_VERSION = "{version}"',
  '^WORKBOOK_SCHEMA_VERSION = "{version}"',
  '^DEFAULT_TOOLKIT_REVISION = "v{version}"',
  '^DET_SPEC_VERSION = "det/v{version}"',
  '^OPERATOR_REGISTRY_VERSION = "{version}"',
]
"dbt/dbt_project.yml" = [
  '^version: {version}$',
]
"aliases/de_toolkit/dbt_project.yml" = [
  '^version: {version}$',
]
